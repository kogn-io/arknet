# Convenience wiring for the arknet-mcp daemon (issue #140).
#
#     docker compose up --build
#
# This encodes the two non-obvious flags so you don't have to remember them:
#
#   * The published port binds to HOST LOOPBACK ONLY (127.0.0.1:47331). The
#     daemon has no authentication (loopback-only trust boundary, ADR-009); the
#     image binds 0.0.0.0 *inside* the container (see arknet-mcp/Dockerfile), so
#     the host-side bind is what keeps it off the LAN. Do NOT change this to a
#     bare "47331:47331" -- that would expose it to every host on your network.
#
#   * The RDF store is mounted from the same host path the plain-jar / other
#     tooling uses (~/.arknet/rdf), so the model survives container restarts and
#     is shared with a non-Docker run.
#
#   * store_overview's HTML report is mounted too (~/.arknet/report), so it
#     lands somewhere a human can actually open it -- and so the write itself
#     succeeds at all: without a writable, mounted report dir, a containerized
#     daemon has no filesystem it shares with its callers to fall back to
#     (issue #158).
#
# Container/host ownership of the mounted store and report dir: arknet-mcp/entrypoint.sh
# adopts the store directory's EXISTING owner automatically at every start (a
# fresh, container-only volume falls back to the image's own non-root user),
# then applies that same identity to the report dir -- no manual chown/chmod
# on the host is needed, and a prior bare-jar run's ownership of ~/.arknet/rdf
# is left untouched. Set PUID/PGID below only if you want to force a specific
# uid:gid regardless of what currently owns the store (e.g. provisioning a
# fresh volume ahead of first use).
services:
  arknet-mcp:
    build:
      context: .
      dockerfile: arknet-mcp/Dockerfile
    image: ghcr.io/kogn-io/arknet:latest
    # environment:
    #   PUID: "1000"
    #   PGID: "1000"
    ports:
      - "127.0.0.1:47331:47331"
    volumes:
      - "${HOME}/.arknet/rdf:/data/rdf"
      - "${HOME}/.arknet/report:/data/report"
    restart: unless-stopped
