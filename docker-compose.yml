# Convenience wiring for the arknet-mcp daemon (issue #140).
#
#     docker compose up --build
#
# This encodes the two non-obvious flags so you don't have to remember them:
#
#   * The published port binds to HOST LOOPBACK ONLY (127.0.0.1:47331). The
#     daemon has no authentication (loopback-only trust boundary, ADR-009); the
#     image binds 0.0.0.0 *inside* the container (see arknet-mcp/Dockerfile), so
#     the host-side bind is what keeps it off the LAN. Do NOT change this to a
#     bare "47331:47331" -- that would expose it to every host on your network.
#
#   * The RDF store is mounted from the same host path the plain-jar / other
#     tooling uses (~/.arknet/rdf), so the model survives container restarts and
#     is shared with a non-Docker run.
#
#   * store_overview's HTML report is mounted too (~/.arknet/report), so it
#     lands somewhere a human can actually open it -- and so the write itself
#     succeeds at all: without a writable, mounted report dir, a containerized
#     daemon has no filesystem it shares with its callers to fall back to
#     (issue #158).
#
#   * ARKNET_REPORT_HOST_DIR tells the daemon the HOST-side path of that same
#     mount, so store_overview's digest line names a path the calling agent
#     (running outside the container) can actually reach, instead of the
#     container-internal /data/report (issue #160). The YAML anchor below
#     keeps the host path defined in exactly one place -- the volume mount and
#     the env var both reference it, so they cannot drift out of sync.
#
#   * project_export's backup dir (~/.arknet/export) is mounted and named to the
#     daemon the same way, for the same reason: without the mount the write
#     fails outright (the container-internal default falls back to the image's
#     root filesystem, not a writable path); without ARKNET_EXPORT_HOST_DIR the
#     tool's result would name the container-internal /data/export.
#
# Container/host ownership of the mounted store, report and export dirs:
# arknet-mcp/entrypoint.sh adopts the store directory's EXISTING owner
# automatically at every start (a fresh, container-only volume falls back to
# the image's own non-root user), then applies that same identity to the
# report and export dirs -- no manual chown/chmod on the host is needed, and
# the ownership an earlier run left on ~/.arknet/rdf is untouched. Set
# PUID/PGID below only if you want to force a specific uid:gid regardless of
# what currently owns the store (e.g. provisioning a fresh volume ahead of
# first use).
x-report-host-dir: &report-host-dir "${HOME}/.arknet/report"
x-export-host-dir: &export-host-dir "${HOME}/.arknet/export"

services:
  arknet-mcp:
    build:
      context: .
      dockerfile: arknet-mcp/Dockerfile
    image: ghcr.io/kogn-io/arknet:latest
    environment:
      ARKNET_REPORT_HOST_DIR: *report-host-dir
      ARKNET_EXPORT_HOST_DIR: *export-host-dir
      # PUID: "1000"
      # PGID: "1000"
    ports:
      - "127.0.0.1:47331:47331"
    volumes:
      - "${HOME}/.arknet/rdf:/data/rdf"
      - type: bind
        source: *report-host-dir
        target: /data/report
      - type: bind
        source: *export-host-dir
        target: /data/export
    restart: unless-stopped
