name: Release — manuell, versionsgated

# Release = ein MANUELLER Lauf dieses Workflows auf main (Forgejo Actions Tab ->
# "Run workflow", oder per API/tea mit version=X.Y.Z). Ein von Hand gepushter
# `vX.Y.Z`-Tag triggert NICHTS -- das ist Absicht: ein Marker-/Bookmark-Tag
# (z.B. "merk_dir_diesen_stand") kann so nie versehentlich ein Release ausloesen.
# Der Tag wird erst NACH erfolgreicher Validierung erzeugt, nie davor.
#
# arknet hat kein Build-Artefakt (kein Maven-Deploy) -- "Release" heisst hier:
# main-HEAD ist versionsgated getaggt und im Marketplace als das aufrufbar, was
# .claude-plugin/plugin.json tatsaechlich behauptet.
#
# Benoetigtes Repo-Secret:
#   RELEASE_TOKEN   Forgejo-Access-Token mit Schreibrechten auf kogn-io/arknet
#                   (Tag-Push + Release-Objekt anlegen). Noch anzulegen, bevor
#                   dieser Workflow das erste Mal erfolgreich durchlaeuft.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release-Version, z.B. 0.3.9 (ohne fuehrendes v)'
        required: true

jobs:
  release:
    runs-on: main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tags werden gebraucht, um eine bereits vergebene Version abzulehnen

      - name: Ref, Version und plugin.json validieren
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ forgejo.ref_name }}" != 'main' ]; then
            echo "::error::Releases werden nur von main geschnitten -- dieser Lauf zielt auf '${{ forgejo.ref_name }}'."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' ist keine SemVer-Version (erwartet X.Y.Z, ohne fuehrendes v)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION existiert bereits -- eine released Version wird nie neu gebaut."
            exit 1
          fi
          PLUGIN_VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          if [ "$PLUGIN_VERSION" != "$VERSION" ]; then
            echo "::error::plugin.json steht auf '$PLUGIN_VERSION', erwartet '$VERSION' -- Versions-Bump vergessen?"
            exit 1
          fi

      - name: Tag auf dem released Commit setzen und pushen
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'forgejo-actions'
          git config user.email 'actions@internal-tracker'
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Forgejo-Release-Objekt anlegen
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          apk add --no-cache curl >/dev/null
          curl -sSf -X POST \
            -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://internal-tracker/api/v1/repos/kogn-io/arknet/releases" \
            -d "{\"tag_name\": \"v${VERSION}\", \"name\": \"v${VERSION}\", \"draft\": false, \"prerelease\": false}"
