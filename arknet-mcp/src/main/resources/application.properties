# arknet MCP server - one shared, admin-started daemon for every project on the machine
# (issue #137), reachable over Streamable HTTP on loopback only. Replaces the earlier
# per-session stdio spawn, which collided on the NativeStore directory lock as soon as two
# processes (parallel Claude Code sessions/worktrees) shared a project. Which project a call
# targets is resolved per call from the X-Arknet-Project-Anchor header (the client's anchor), so
# one port serves all projects. Bound to 127.0.0.1 only, never a public interface - loopback-only
# means no authentication is required (same trust boundary as the local process spawn it replaces).
spring.main.banner-mode=off
# Makes the Maven build's own build-info.properties (spring-boot-maven-plugin:build-info,
# issue #194) readable as ordinary properties - build.version is ${revision}, build.time the
# build timestamp. Spring Boot's BuildProperties bean reads the same file, but only as a bean:
# a property placeholder needs a property source, and arknet.version below is one.
# Optional, because running from a source tree that was never built produces no such file.
spring.config.import=optional:classpath:META-INF/build-info.properties
server.address=127.0.0.1
server.port=${arknet.mcp.port:47331}
# Waits for in-flight requests to finish before running destroy callbacks on shutdown (issue #140):
# the shared DatasetLifecycle bean's close() only best-effort-closes datasets that are not held open
# by a concurrently in-flight MCP tool call, so shrinking that window here means fewer datasets fall
# back to crash recovery. Spring's default per-phase timeout (30s) applies; not overridden.
server.shutdown=graceful

# Spring AI MCP server: Streamable HTTP transport. Despite the "streamable" default
# documented on McpServerProperties#protocol, the @ConditionalOnProperty gating
# McpServerStreamableHttpWebMvcAutoConfiguration requires the property to be present
# (matchIfMissing=false) - so it must be set explicitly, not left to that default.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=arknet
spring.ai.mcp.server.version=${arknet.version}
spring.ai.mcp.server.instructions=arknet manages DDD architecture models (requirements, use cases, glossary terms, constraints, bounded contexts, actors, architecture decision records) as an RDF/SKOS store with SHACL write validation, plus a generic store overview/resource browser. Requirements/use cases/glossary say WHAT the system does; architecture decision records (adr_add) say HOW it is built - record one only for a decision with real architectural significance (structure, an interface, a dependency, a quality attribute or a project-wide construction technique) that would be costly to reverse, not a convention, a reversible default or an open work item. adr_check reads the whole decision corpus and reports what is mechanically decidable about it, facts separated from hints; it changes nothing and names in its own output the review rules it cannot carry.

# Requirements hexagon: directory the embedded kognio-rdf store persists into.
# One dataset per project; single-user default operates against 'default'.
arknet.rdf.storage=${user.home}/.arknet/rdf

# Which build this daemon runs - ONE string, stated in three places (issue #194): the MCP
# initialize handshake above (spring.ai.mcp.server.version, what every client sees), the metadata
# graph project_export appends to a backup dump, and the " [arknet <version>]" suffix on every
# failing tool call. Deriving it three times would let a stale daemon contradict itself, which is
# the exact confusion this answers.
# No hand-maintained constant (issue #159): ARKNET_VERSION is baked into the Docker image at build
# time from the release tag (release.yml) or commit sha (docker.yml) and wins when set. Otherwise
# build.version - the Maven ${revision} of the jar being run - covers the bare-jar path, which has
# no release-tag concept of its own. 'unknown' remains for a run with neither: an IDE launch
# against a source tree that was never packaged. It is a placeholder to be recognised, not a
# version to be believed.
arknet.version=${ARKNET_VERSION:${build.version:unknown}}

# Display language (issue #80): which skos:prefLabel a multilingual glossary concept is
# shown in. arknet.locale.requested is the requested language, arknet.locale.default the
# system fallback; if neither is present the read paths fall back to an untagged label, then
# to a deterministic last resort - a term is never hidden for lacking the requested language.
# Both are BCP-47 language tags. Defaults to English; term_add writes untagged labels today,
# which the untagged fallback surfaces regardless of these values.
arknet.locale.requested=en
arknet.locale.default=en
