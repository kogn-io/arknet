# arknet MCP server - single-user stdio server.
#
# stdout is the MCP transport channel: no console output must leak there.
# The banner is off and logging goes to stderr (see logback.xml); the web
# server is disabled.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Spring AI MCP server: stdio transport, server identity.
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=arknet
spring.ai.mcp.server.version=0.2.0
spring.ai.mcp.server.instructions=arknet exposes DDD architecture models (Turtle/RDF) for querying, validation and documentation generation, plus requirement lifecycle tools.

# Requirements hexagon: directory the embedded kognio-rdf store persists into.
# One dataset per workspace; single-user default operates against 'default'.
arknet.rdf.storage=${user.home}/.arknet/rdf
