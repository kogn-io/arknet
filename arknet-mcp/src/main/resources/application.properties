# arknet MCP server - one shared, admin-started daemon for every project on the machine
# (issue #137, ADR-009), reachable over Streamable HTTP on loopback only. Replaces the earlier
# per-session stdio spawn, which collided on the NativeStore directory lock as soon as two
# processes (parallel Claude Code sessions/worktrees) shared a project. Which project a call
# targets is resolved per call from the X-Arknet-Project-Anchor header (the client's anchor), so
# one port serves all projects. Bound to 127.0.0.1 only, never a public interface - loopback-only
# means no authentication is required (same trust boundary as the local process spawn it replaces).
spring.main.banner-mode=off
server.address=127.0.0.1
server.port=${arknet.mcp.port:47331}

# Spring AI MCP server: Streamable HTTP transport. Despite the "streamable" default
# documented on McpServerProperties#protocol, the @ConditionalOnProperty gating
# McpServerStreamableHttpWebMvcAutoConfiguration requires the property to be present
# (matchIfMissing=false) - so it must be set explicitly, not left to that default.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=arknet
# No hand-maintained constant (issue #159): ARKNET_VERSION is baked into the Docker image
# at build time from the release tag (release.yml) or commit sha (docker.yml). The 'dev'
# fallback covers the non-Docker bare-jar path, which has no release-tag concept of its own.
spring.ai.mcp.server.version=${ARKNET_VERSION:dev}
spring.ai.mcp.server.instructions=arknet manages DDD architecture models (requirements, glossary terms, use cases) as an RDF/SKOS store with SHACL write validation, plus a generic store overview/resource browser.

# Requirements hexagon: directory the embedded kognio-rdf store persists into.
# One dataset per project; single-user default operates against 'default'.
arknet.rdf.storage=${user.home}/.arknet/rdf

# Display language (issue #80): which skos:prefLabel a multilingual glossary concept is
# shown in. arknet.locale.requested is the requested language, arknet.locale.default the
# system fallback; if neither is present the read paths fall back to an untagged label, then
# to a deterministic last resort - a term is never hidden for lacking the requested language.
# Both are BCP-47 language tags. Defaults to English; term_add writes untagged labels today,
# which the untagged fallback surfaces regardless of these values.
arknet.locale.requested=en
arknet.locale.default=en
