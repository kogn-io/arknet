name: Docker image (arknet-mcp)

# Continuously builds and publishes the arknet-mcp daemon image to GHCR as
# `:latest`/`:<sha>` on every push to main -- unversioned, always moving. The
# immutable, SemVer-tagged `vX.Y.Z` image is a separate, manual publish; see
# release.yml.

# The trigger is a NEGATIVE filter on purpose (kogn-io/arknet#379). It used to be a
# positive `paths` list enumerating the modules that go into the image. That list was
# complete the day it was written and silently rotted: arknet-project, arknet-adr and
# arknet-actor were added to the reactor afterwards and never appended, so a fix
# touching only one of them merged green while `:latest` stayed on the old build --
# no failed run, no skipped job, just a daemon that keeps serving the old code.
# A positive list has to be maintained on every new module; forgetting is silent and
# wrong. With paths-ignore, forgetting costs a redundant build and is loud.
# Only list here what provably cannot change the produced jar: no .md is a packaged
# resource, and no pom refers to docs/.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".mcp.json"
      - "docker-compose.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: arknet-mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: ARKNET_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
