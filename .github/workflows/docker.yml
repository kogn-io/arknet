name: Docker image (arknet-mcp)

# Continuously builds and publishes the arknet-mcp daemon image to GHCR as
# `:latest`/`:<sha>` on every push to main -- unversioned, always moving. The
# immutable, SemVer-tagged `vX.Y.Z` image is a separate, manual publish; see
# release.yml.

on:
  push:
    branches: [main]
    paths:
      - "arknet-mcp/**"
      - "arknet-shared-kernel/**"
      - "arknet-persistence-support/**"
      - "arknet-requirements/**"
      - "arknet-ubiquitous-language/**"
      - "arknet-use-cases/**"
      - "arknet-bounded-context/**"
      - "arknet-ontology/**"
      - "pom.xml"
      - ".github/workflows/docker.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: arknet-mcp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
