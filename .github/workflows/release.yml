name: Release (manual, version-gated Docker image)

# Release = one MANUAL run of this workflow on main (Actions tab -> "Run workflow",
# or via `gh workflow run` with version=X.Y.Z). A hand-pushed `vX.Y.Z` tag triggers
# NOTHING -- that is deliberate: a marker/bookmark tag can never accidentally cut a
# release. The tag is created only AFTER successful validation, never before.
#
# Publishes an immutable, SemVer-tagged Docker image for external consumers, on top
# of docker.yml's continuous `:latest`/`:<sha>` publish on every push to main.
# `:latest` moves; `vX.Y.Z` never does -- a consumer pins to `vX.Y.Z` and gets a
# fixed, reproducible daemon. Independent of the Maven `<revision>` property (stays
# SNAPSHOT decoration -- no Maven artifact is deployed) and independent of the
# plugin-marketplace release, which lives in its own repository now.
#
# Uses the built-in GITHUB_TOKEN (contents: write, packages: write below) for the
# image push, the tag push and the GitHub release object -- no dedicated release
# secret needed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0 (no leading v)'
        required: true
        type: string

permissions:
  contents: write # tag push + GitHub release object
  packages: write # versioned image push to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags needed to reject an already-released version

      - name: Validate ref and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.ref_name }}" != 'main' ]; then
            echo "::error::Releases are cut from main only -- this run targets '${{ github.ref_name }}'."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a SemVer version (expected X.Y.Z, no leading v)."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists -- a released version is never rebuilt."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: arknet-mcp/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:v${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the released commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release object
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --generate-notes lists the pull requests merged since the previous tag --
        # a release page is the one place an outside reader checks whether anything
        # is moving, so an empty one is worse than no release at all.
        run: |
          gh release create "v$VERSION" --title "v$VERSION" --verify-tag --generate-notes
